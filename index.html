<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>언론사 포럼 관리 시스템</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase App & Firestore Legacy SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
    body {
      font-family: 'Pretendard', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- 네비게이션 바 -->
  <nav class="bg-indigo-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <i class="fa-solid fa-users-rectangle text-2xl text-yellow-400"></i>
          <span class="font-bold text-lg sm:text-xl tracking-tight">언론사 포럼 관리 시스템</span>
        </div>
        <div class="flex items-center space-x-2">
          <!-- 🟢 동기화 상태 배지 -->
          <span id="syncStatus" class="bg-yellow-500 text-slate-900 text-xs font-semibold px-2.5 py-1 rounded-full flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-slate-900 animate-pulse"></span>
            연결 대기 중
          </span>
          <button onclick="resetData()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded transition font-medium">
            <i class="fa-solid fa-rotate-left mr-1"></i>리셋
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 메인 컨테이너 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
    
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
      
      <!-- [좌측 영역] 팀원(참석 인력) 관리 -->
      <section class="lg:col-span-1 bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-user-group text-indigo-600"></i>참석 인력 목록
          </h2>
          <span id="memberCount" class="text-xs bg-indigo-100 text-indigo-800 font-bold px-2 py-0.5 rounded-full">0명</span>
        </div>
        
        <!-- 팀원 추가 폼 -->
        <form id="memberForm" class="mb-4 flex gap-2">
          <input type="text" id="newMemberName" placeholder="새 인력 이름" required
                 class="flex-1 text-sm border border-slate-300 rounded px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded text-sm transition">
            추가
          </button>
        </form>

        <!-- 팀원 리스트 -->
        <ul id="memberList" class="space-y-1.5 max-h-[400px] overflow-y-auto pr-1">
          <!-- 렌더링 영역 -->
        </ul>
      </section>

      <!-- [우측 영역] 포럼 일정 리스트 -->
      <section class="lg:col-span-3 space-y-4">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200 gap-3">
          <div>
            <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
              <i class="fa-solid fa-calendar-days text-indigo-600"></i>포럼 및 미디어 간담회 일정
            </h2>
            <p class="text-xs text-slate-500 mt-0.5">실시간으로 인원 배정 현황과 참석 여부가 모든 팀원에게 동기화됩니다.</p>
          </div>
          <button onclick="openForumModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow transition flex items-center gap-1.5">
            <i class="fa-solid fa-plus"></i>새 일정 등록
          </button>
        </div>

        <!-- 카드 그리드 리스트 -->
        <div id="forumGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- 렌더링 영역 -->
        </div>
      </section>

    </div>
  </main>

  <!-- [모달] 포럼 일정 추가/수정 모달 -->
  <div id="forumModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden border border-slate-200">
      <header class="bg-indigo-900 text-white px-5 py-4 flex justify-between items-center">
        <h3 id="modalTitle" class="font-bold text-lg">새 포럼 일정 등록</h3>
        <button onclick="closeForumModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </header>
      <form id="forumForm" class="p-5 space-y-4">
        <input type="hidden" id="editForumId">
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">매체사명 *</label>
            <input type="text" id="forumMedia" required placeholder="예: MBC, SBS"
                   class="w-full text-sm border border-slate-300 rounded p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">행사 성격</label>
            <input type="text" id="forumType" placeholder="예: 간담회, 포럼, 식사"
                   class="w-full text-sm border border-slate-300 rounded p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">날짜 *</label>
            <input type="date" id="forumDate" required
                   class="w-full text-sm border border-slate-300 rounded p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">시간</label>
            <input type="text" id="forumTime" placeholder="예: 12:00, 18:30"
                   class="w-full text-sm border border-slate-300 rounded p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">장소</label>
          <input type="text" id="forumLocation" placeholder="예: 여의도 식당, 회사 대회의실"
                 class="w-full text-sm border border-slate-300 rounded p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">메모/상세 내용</label>
          <textarea id="forumMemo" rows="3" placeholder="기타 참고사항 기재"
                    class="w-full text-sm border border-slate-300 rounded p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
        </div>

        <footer class="flex justify-end gap-2 pt-2 border-t border-slate-100">
          <button type="button" onclick="closeForumModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded text-sm transition">취소</button>
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-sm transition">저장하기</button>
        </footer>
      </form>
    </div>
  </div>

  <script>
    // -----------------------------------------------------------
    // 1. Firebase 설정 정의 (형님의 고유 Key 적용됨)
    // -----------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyDE_g9gA9LpXbY0_Y1u-LwY2v3B4C5D6E",
      authDomain: "forum-management-system-89970.firebaseapp.com",
      projectId: "forum-management-system-89970",
      storageBucket: "forum-management-system-89970.appspot.com",
      messagingSenderId: "305118745330",
      appId: "1:305118745330:web:d2e3f4g5h6i7j8k9l0m1n2"
    };

    // Firebase 초기화 (중복 설정 방지 및 방화벽 우회 연결 설정)
    let db = null;
    try {
      const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
      db = firebase.firestore(app);
      
      // 사내 보안망 차단 대응: Long Polling 및 중복 설정 병합
      db.settings({
        experimentalAutoDetectLongPolling: true,
        merge: true
      });
    } catch(e) {
      console.warn("Firebase 초기화 에러:", e);
    }

    // -----------------------------------------------------------
    // 2. 초기 더미 데이터 (클라우드 데이터가 비어 있을 때만 적용)
    // -----------------------------------------------------------
    const initialTeamMembers = ["윤지남", "홍길동", "이순신", "강감찬", "유관순"];
    const initialForums = [
      { id: "f1", media: "MBC", type: "방송기자 간담회", date: "2026-11-06", time: "12:00", location: "여의도 한식당", memo: "메인 안건 논의", attendees: ["윤지남", "홍길동"], attendeeStatus: {"윤지남": "confirmed", "홍길동": "confirmed"} },
      { id: "f2", media: "SBS", type: "미디어 세미나", date: "2026-11-12", time: "15:00", location: "본사 소강당", memo: "기술 트렌드 공유", attendees: ["윤지남", "이순신", "강감찬"], attendeeStatus: {"윤지남": "confirmed", "이순신": "pending", "강감찬": "declined"} }
    ];

    // 실행 상태 데이터
    let teamMembers = [];
    let forums = [];

    // -----------------------------------------------------------
    // 3. [방화벽 우회 통합 버전] Firebase 실시간 동기화
    // -----------------------------------------------------------
    async function initFirebaseSync() {
      const statusEl = document.getElementById('syncStatus');
      const projectId = firebaseConfig.projectId;
      const apiKey = firebaseConfig.apiKey;
      const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/forumApp/globalData?key=${apiKey}`;

      // Firestore REST 데이터를 일반 JS 데이터로 파싱하는 함수
      function fromFirestoreValue(field) {
        if (!field) return null;
        if ('stringValue' in field) return field.stringValue;
        if ('integerValue' in field) return Number(field.integerValue);
        if ('doubleValue' in field) return Number(field.doubleValue);
        if ('booleanValue' in field) return field.booleanValue;
        if ('nullValue' in field) return null;
        if ('arrayValue' in field) {
          return (field.arrayValue.values || []).map(fromFirestoreValue);
        }
        if ('mapValue' in field) {
          const obj = {};
          const fields = field.mapValue.fields || {};
          for (const k in fields) obj[k] = fromFirestoreValue(fields[k]);
          return obj;
        }
        return null;
      }

      // 1. 방화벽 100% 통과: 표준 HTTPS GET으로 즉시 최신 데이터 로딩
      try {
        const res = await fetch(url);
        if (res.ok) {
          const doc = await res.json();
          if (doc.fields) {
            const loadedMembers = fromFirestoreValue(doc.fields.teamMembers);
            const loadedForums = fromFirestoreValue(doc.fields.forums);
            if (loadedMembers && loadedMembers.length > 0) teamMembers = loadedMembers;
            if (loadedForums && loadedForums.length > 0) forums = loadedForums;
            ensureAttendeeStatus();
            renderAll();
            if (statusEl) statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-900 animate-pulse"></span>🟢 실시간 동기화 중`;
          }
        }
      } catch (e) {
        console.warn("REST 로드 실패, 로컬 백업 탐색:", e);
        loadLocalFallback();
      }

      // 2. 실시간 모니터링 결합 (가능한 브라우저 전용)
      if (db) {
        db.collection("forumApp").doc("globalData").onSnapshot((doc) => {
          if (doc.exists) {
            const data = doc.data();
            if (data.teamMembers && data.teamMembers.length > 0) teamMembers = data.teamMembers;
            if (data.forums && data.forums.length > 0) forums = data.forums;
            ensureAttendeeStatus();
            renderAll();
            if (statusEl) statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-900 animate-pulse"></span>🟢 실시간 동기화 중`;
          }
        }, (err) => {
          console.warn("실시간 감지가 제한되어 새로고침 기반으로 대처합니다.");
        });
      }
    }

    function loadLocalFallback() {
      const savedM = localStorage.getItem('forum_team_fb_local');
      const savedF = localStorage.getItem('forum_list_fb_local');
      teamMembers = savedM ? JSON.parse(savedM) : JSON.parse(JSON.stringify(initialTeamMembers));
      forums = savedF ? JSON.parse(savedF) : JSON.parse(JSON.stringify(initialForums));
      ensureAttendeeStatus();
      renderAll();
    }

    function ensureAttendeeStatus() {
      forums.forEach(f => {
        if (!f.attendeeStatus) {
          f.attendeeStatus = {};
          if (f.attendees) {
            f.attendees.forEach(a => f.attendeeStatus[a] = f.status || 'pending');
          }
        }
      });
    }

    // -----------------------------------------------------------
    // [방화벽 우회 통합 버전] HTTPS PATCH 전송으로 안전 저장 구현
    // -----------------------------------------------------------
    async function saveData(isInit = false) {
      if (isInit) {
        teamMembers = JSON.parse(JSON.stringify(initialTeamMembers));
        forums = JSON.parse(JSON.stringify(initialForums));
        ensureAttendeeStatus();
      }

      // 로컬 디바이스 즉시 캐시 백업
      localStorage.setItem('forum_team_fb_local', JSON.stringify(teamMembers));
      localStorage.setItem('forum_list_fb_local', JSON.stringify(forums));

      const statusEl = document.getElementById('syncStatus');
      if (statusEl) statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-900 animate-pulse"></span>⏳ 서버에 저장 중...`;

      const projectId = firebaseConfig.projectId;
      const apiKey = firebaseConfig.apiKey;
      const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/forumApp/globalData?key=${apiKey}`;

      // 일반 객체 ➔ Firestore 규격 빌더 헬퍼
      function toFirestoreValue(val) {
        if (val === null || val === undefined) return { nullValue: null };
        if (typeof val === 'boolean') return { booleanValue: val };
        if (typeof val === 'number') {
          return Number.isInteger(val) ? { integerValue: String(val) } : { doubleValue: val };
        }
        if (typeof val === 'string') return { stringValue: val };
        if (Array.isArray(val)) {
          return { arrayValue: { values: val.map(toFirestoreValue) } };
        }
        if (typeof val === 'object') {
          const fields = {};
          for (const k in val) {
            if (val[k] !== undefined) fields[k] = toFirestoreValue(val[k]);
          }
          return { mapValue: { fields } };
        }
        return { stringValue: String(val) };
      }

      const bodyData = {
        fields: {
          teamMembers: toFirestoreValue(teamMembers),
          forums: toFirestoreValue(forums),
          lastUpdated: { stringValue: new Date().toISOString() }
        }
      };

      try {
        const response = await fetch(url, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });

        if (response.ok) {
          console.log("✅ REST API 방식으로 서버 저장 성공!");
          if (statusEl) statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-900 animate-pulse"></span>🟢 서버 저장 완료 (동기화됨)`;
        } else {
          throw new Error(`HTTP Error: ${response.status}`);
        }
      } catch (err) {
        console.error("❌ REST API 저장 차단됨. 일반 채널 재시도:", err);
        if (statusEl) statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-900 animate-pulse"></span>⚠️ 사내망 쓰기 차단됨 (모바일에서 입력 요망)`;
        
        // 차선책 저장 보완구동
        if (db) {
          db.collection("forumApp").doc("globalData").set({
            teamMembers: teamMembers,
            forums: forums,
            lastUpdated: new Date().toISOString()
          });
        }
      }
    }

    function resetData() {
      if (confirm('전체 데이터를 초기값으로 리셋하시겠습니까?\n모든 팀원의 화면에서도 동시에 초기화됩니다.')) {
        saveData(true);
      }
    }

    // -----------------------------------------------------------
    // 4. 화면 UI 렌더링 로직 (기존 스타일 완벽 매칭)
    // -----------------------------------------------------------
    function renderAll() {
      renderMembers();
      renderForums();
    }

    function renderMembers() {
      const list = document.getElementById('memberList');
      list.innerHTML = '';
      document.getElementById('memberCount').innerText = `${teamMembers.length}명`;

      teamMembers.forEach((m, idx) => {
        const li = document.createElement('li');
        li.className = "flex justify-between items-center bg-slate-100 px-3 py-2 rounded text-sm font-medium hover:bg-slate-200 transition";
        li.innerHTML = `
          <span class="text-slate-700"><i class="fa-solid fa-user text-xs text-slate-400 mr-2"></i>${m}</span>
          <button onclick="deleteMember(${idx})" class="text-slate-400 hover:text-red-500 transition text-xs">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        `;
        list.appendChild(li);
      });
    }

    function renderForums() {
      const grid = document.getElementById('forumGrid');
      grid.innerHTML = '';

      if (forums.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full bg-white border border-dashed border-slate-300 rounded-xl p-12 text-center text-slate-500">
            <i class="fa-solid fa-calendar-xmark text-4xl mb-3 text-slate-300"></i>
            <p class="text-sm font-medium">등록된 행사 일정이 없습니다.</p>
          </div>
        `;
        return;
      }

      forums.forEach((f) => {
        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition relative group";
        
        // 포럼 카드 상단 헤더
        let attendeesHTML = '';
        teamMembers.forEach((m) => {
          const isAttending = f.attendees && f.attendees.includes(m);
          const status = f.attendeeStatus && f.attendeeStatus[m] ? f.attendeeStatus[m] : 'pending';
          
          let btnClass = "bg-slate-100 text-slate-500 hover:bg-indigo-100 hover:text-indigo-700";
          let icon = "fa-plus";
          
          if (isAttending) {
            if (status === 'confirmed') {
              btnClass = "bg-emerald-100 text-emerald-800 border border-emerald-300 font-semibold";
              icon = "fa-check";
            } else if (status === 'declined') {
              btnClass = "bg-rose-100 text-rose-800 border border-rose-300 line-through text-slate-400";
              icon = "fa-xmark";
            } else {
              btnClass = "bg-amber-100 text-amber-800 border border-amber-300 font-semibold";
              icon = "fa-question";
            }
          }

          attendeesHTML += `
            <button onclick="toggleAttendeeStatus('${f.id}', '${m}')" class="text-xs px-2 py-1 rounded transition flex items-center gap-1 ${btnClass}">
              <i class="fa-solid ${icon} text-[10px]"></i> ${m}
            </button>
          `;
        });

        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2">
              <span class="bg-indigo-50 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded border border-indigo-200">
                ${f.media}
              </span>
              <div class="flex items-center gap-1">
                <button onclick="openForumModal('${f.id}')" class="text-slate-400 hover:text-indigo-600 p-1 text-xs" title="수정"><i class="fa-solid fa-pen"></i></button>
                <button onclick="deleteForum('${f.id}')" class="text-slate-400 hover:text-red-500 p-1 text-xs" title="삭제"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
            
            <h3 class="font-bold text-slate-800 text-base mb-3">${f.type || '간담회/식사'}</h3>
            
            <div class="space-y-1.5 text-xs text-slate-600 mb-4">
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-calendar w-4 text-slate-400"></i>
                <span class="font-semibold text-slate-700">${f.date}</span> <span class="text-slate-400">|</span> <span>${f.time || '시간 조율 중'}</span>
              </div>
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-location-dot w-4 text-slate-400"></i>
                <span>${f.location || '장소 미정'}</span>
              </div>
              ${f.memo ? `
              <div class="flex items-start gap-2 pt-1 border-t border-slate-100 mt-1.5">
                <i class="fa-solid fa-info-circle w-4 text-slate-400 mt-0.5"></i>
                <p class="text-slate-500 leading-normal flex-1">${f.memo}</p>
              </div>` : ''}
            </div>
          </div>
          
          <div class="border-t border-slate-100 pt-3 mt-3">
            <span class="block text-[11px] font-bold text-slate-500 mb-2">배정 인력 및 상태 배정</span>
            <div class="flex flex-wrap gap-1.5">
              ${attendeesHTML}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // -----------------------------------------------------------
    // 5. 비즈니스 액션 이벤트 핸들러
    // -----------------------------------------------------------
    document.getElementById('memberForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('newMemberName');
      const name = input.value.trim();
      if (!name) return;

      if (teamMembers.includes(name)) {
        alert('이미 등록된 인력명입니다.');
        return;
      }

      teamMembers.push(name);
      input.value = '';
      saveData();
      renderAll();
    });

    function deleteMember(idx) {
      const name = teamMembers[idx];
      if (confirm(`'${name}' 님을 인력 목록에서 완전히 제외하시겠습니까?`)) {
        teamMembers.splice(idx, 1);
        forums.forEach(f => {
          if (f.attendees) f.attendees = f.attendees.filter(a => a !== name);
          if (f.attendeeStatus) delete f.attendeeStatus[name];
        });
        saveData();
        renderAll();
      }
    }

    function toggleAttendeeStatus(forumId, memberName) {
      const f = forums.find(item => item.id === forumId);
      if (!f) return;

      if (!f.attendees) f.attendees = [];
      if (!f.attendeeStatus) f.attendeeStatus = {};

      const isAttending = f.attendees.includes(memberName);

      if (!isAttending) {
        f.attendees.push(memberName);
        f.attendeeStatus[memberName] = 'confirmed';
      } else {
        const currentStatus = f.attendeeStatus[memberName];
        if (currentStatus === 'confirmed') {
          f.attendeeStatus[memberName] = 'pending';
        } else if (currentStatus === 'pending') {
          f.attendeeStatus[memberName] = 'declined';
        } else {
          f.attendees = f.attendees.filter(a => a !== memberName);
          delete f.attendeeStatus[memberName];
        }
      }

      saveData();
      renderAll();
    }

    // 모달 제어 핸들러
    function openForumModal(id = null) {
      const modal = document.getElementById('forumModal');
      const title = document.getElementById('modalTitle');
      const form = document.getElementById('forumForm');
      
      form.reset();
      document.getElementById('editForumId').value = id || '';

      if (id) {
        title.innerText = "포럼 일정 수정";
        const f = forums.find(item => item.id === id);
        if (f) {
          document.getElementById('forumMedia').value = f.media || '';
          document.getElementById('forumType').value = f.type || '';
          document.getElementById('forumDate').value = f.date || '';
          document.getElementById('forumTime').value = f.time || '';
          document.getElementById('forumLocation').value = f.location || '';
          document.getElementById('forumMemo').value = f.memo || '';
        }
      } else {
        title.innerText = "새 포럼 일정 등록";
        document.getElementById('forumDate').value = new Date().toISOString().substring(0, 10);
      }
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeForumModal() {
      const modal = document.getElementById('forumModal');
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    }

    document.getElementById('forumForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('editForumId').value;
      const media = document.getElementById('forumMedia').value.trim();
      const type = document.getElementById('forumType').value.trim();
      const date = document.getElementById('forumDate').value;
      const time = document.getElementById('forumTime').value.trim();
      const location = document.getElementById('forumLocation').value.trim();
      const memo = document.getElementById('forumMemo').value.trim();

      if (id) {
        // 수정 모드
        const f = forums.find(item => item.id === id);
        if (f) {
          f.media = media;
          f.type = type;
          f.date = date;
          f.time = time;
          f.location = location;
          f.memo = memo;
        }
      } else {
        // 추가 모드
        const newF = {
          id: 'f_' + Date.now(),
          media, type, date, time, location, memo,
          attendees: [],
          attendeeStatus: {}
        };
        forums.push(newF);
      }

      saveData();
      renderAll();
      closeForumModal();
    });

    function deleteForum(id) {
      if (confirm('이 포럼 일정을 완전히 삭제하시겠습니까?')) {
        forums = forums.filter(item => item.id !== id);
        saveData();
        renderAll();
      }
    }

    // 초기 구동 실행
    window.addEventListener('DOMContentLoaded', () => {
      initFirebaseSync();
    });
  </script>
</body>
</html>
